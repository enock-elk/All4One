<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>All4One</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
            var path = location.pathname + location.search + location.hash;
            try { sessionStorage.setItem('all4one_deep_link', path); } catch (e) {}
            var parts = location.pathname.split('/').filter(Boolean);
            var repo = parts[0] || 'All4One';
            var slug = '';
            if (parts[1] && parts[1].toLowerCase() === 'docs') slug = parts[2] || '';
            else if (parts[1] && !/^index\.html$/i.test(parts[1])) slug = parts[1];
            location.replace('/' + repo + '/docs/' + slug + location.search + location.hash);
        })();
    </script>
</head>
<body>
    <p style="font-family:ui-sans-serif,system-ui,sans-serif;padding:2rem;color:#64748b;">Opening All4One…</p>
</body>
</html>
