name: Deploy to GitHub Pages

# GitHub Pages is still "legacy / publish the whole repo from main".
# The live app is therefore the committed docs/ snapshot (root index.html
# redirects github.io visitors there). Rebuild docs/ here so a source push
# is enough — nobody has to remember npm run build locally.
#
# Later: Settings → Pages → Source = GitHub Actions, then docs/ can go.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Commit docs snapshot for branch-based Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "docs/ already matches this build"
            exit 0
          fi
          git commit -m "Rebuild GitHub Pages bundle from source"
          git pull --rebase origin main
          git push origin HEAD:main

      # Re-enable when Settings → Pages → Source is GitHub Actions:
      # - uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: dist
